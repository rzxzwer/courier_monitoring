<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Система мониторинга курьеров{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <!-- Leaflet CSS (без integrity / crossorigin, чтобы не блокировалось) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Leaflet JS (без integrity / crossorigin) -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      defer
    ></script>

    <!-- Твои скрипты -->
    <script defer src="{{ url_for('static', filename='js/tabs.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>
<body>
    {% include 'header.html' %}

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% include 'footer.html' %}
</body>
</html>
